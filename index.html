<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>AeroWatch | Global & India Air Pollution Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser/build/stlite.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0b0f19;
      color: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 10% 20%, #0d1527 0%, #080c14 90%);
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(6, 182, 212, 0.2);
      border-top: 4px solid #06b6d4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .loading-sub {
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div class="loading-title">🌍 AeroWatch Intelligence Platform</div>
    <div class="loading-sub">Initializing browser WebAssembly runtime & datasets...</div>
  </div>
  <div id="root"></div>

  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser/build/stlite.js";

    mount({
      entrypoint: "app.py",
      files: {
        "app.py": {
          url: "./app.py"
        },
        "geo_data.py": {
          url: "./geo_data.py"
        },
        "global air pollution dataset.csv": {
          url: "./global%20air%20pollution%20dataset.csv"
        },
        "Indian_water_data.csv": {
          url: "./Indian_water_data.csv"
        }
      },
      requirements: ["pandas", "numpy", "plotly", "statsmodels"]
    }, document.getElementById("root"));

    const checkLoaded = setInterval(() => {
      const appContainer = document.querySelector('[data-testid="stAppViewContainer"]') || document.querySelector('.stApp');
      if (appContainer && appContainer.innerText && appContainer.innerText.length > 50) {
        clearInterval(checkLoaded);
        const loader = document.getElementById("loading-indicator");
        if (loader) {
          loader.style.opacity = "0";
          setTimeout(() => loader.remove(), 400);
        }
      }
    }, 300);
  </script>
</body>
</html>
